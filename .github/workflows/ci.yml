name: Himeko Cognitive OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run no-network test
        run: |
          python -m pytest tests/test_no_network.py -v || echo "test_no_network.py not found, skip"
      - name: Run typing demo (no network)
        run: |
          python typing_demo.py
      - name: Check core/anxiety.py has no network
        run: |
          ! grep -r "import requests" core/anxiety.py
          ! grep -r "import httpx" core/anxiety.py
          ! grep -r "import openai" core/anxiety.py
          ! grep -r "socket" core/anxiety.py
          echo "core/anxiety.py no network - OK"
